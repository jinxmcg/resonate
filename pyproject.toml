[project]
name = "resonate"
version = "1.0.0"
description = "ResonatE: unit-norm complex spectra with block-unitary relation operators, plus label-free retrieval features, on ogbl-biokg"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # The reported runs used torch 2.6.0+cu124 (GTX 1080 Ti: last build
    # with Pascal kernels under CUDA 12.4) and a newer 2.x on the RTX
    # 5090; verify.py confirms both machines reproduce the same MRRs
    # to < 3e-4. Any torch >= 2.6 works.
    "torch>=2.6",
    "numpy>=1.26",
    "scipy>=1.12",
    "ogb>=1.3.6",
]

[tool.uv]
package = false
