[program:biokg_nl1]
environment=PROC_NAME="biokg_nl1"
directory=/workspace/biokg_nl1
command=/bin/bash /workspace/biokg_nl1/biokg/scripts/run_nonlinear.sh
autostart=false
autorestart=false
startsecs=2
exitcodes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
